name: CI

# CI for the TCG market cap / marketplace / drop alerts site.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tcg-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database (migrations, RLS, business rules)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run SQL tests
        run: supabase/tests/run.sh
      - uses: astral-sh/setup-uv@v6
      - name: Pipeline integration tests (market cap, member sightings, reminders, eBay deals, prices, stock, images)
        working-directory: workers
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tcg_test
        run: uv run pytest -q tests/test_jobs_db.py tests/test_sightings_db.py tests/test_ebay_deals.py tests/test_pricecharting_db.py tests/test_justtcg_db.py tests/test_stock_db.py tests/test_images_db.py

  workers:
    name: Workers (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy tcgworkers
      # Fixture-based only: no live retailer or API calls in CI (brief 15).
      - run: uv run pytest -q

  web:
    name: Web (lint, types, unit, build, SEO, e2e, Lighthouse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: SEO checks (titles, canonicals, JSON-LD, noindex facets, links, sitemaps)
        run: |
          npx next start -p 3100 &
          npx wait-on -t 60000 http://localhost:3100/
          BASE_URL=http://localhost:3100 npm run seo:check
      - name: End-to-end (Playwright, demo data)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Lighthouse budgets (performance & accessibility >= 90)
        run: npx -y @lhci/cli@0.15 autorun
      - name: Cloudflare Workers build (OpenNext)
        run: npx opennextjs-cloudflare build

  full-stack:
    name: Full stack e2e (local Supabase, marketplace, messaging, alerts, admin)
    runs-on: ubuntu-latest
    needs: [web]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_SUPABASE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (Postgres, Auth, Storage, Realtime, Mailpit) with migrations + seed
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install worker dependencies (the account e2e runs the alert dispatcher)
        working-directory: workers
        run: uv sync --frozen
      - name: Write local env
        working-directory: web
        run: |
          supabase status -o env | sed -n 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/p; s/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p; s/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p' | tr -d '"' > .env.local
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3401" >> .env.local
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Account, sell, messaging e2e
        working-directory: web
        run: npx playwright test -c e2e/account/playwright.config.ts
      - name: Admin e2e
        working-directory: web
        run: npx playwright test -c e2e/admin/playwright.config.ts
      - name: Workers against live stack (alerts end-to-end to Mailpit)
        working-directory: workers
        env:
          TEST_SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: uv run pytest -q
